name: 뉴스 수집

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:
  push:
    paths:
      - tickers.json
      - scripts/fetch_news.py

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 뉴스 모으기
        run: python scripts/fetch_news.py
      - name: 바뀌었으면 저장
        run: |
          if git diff --quiet -- news.json && git ls-files --error-unmatch news.json >/dev/null 2>&1; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "뉴스 갱신 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin main
          git push
